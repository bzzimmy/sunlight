name: ci
on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all --check

  clippy:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
        targets: aarch64-apple-ios-macabi
    - run: cargo clippy --all-targets --target aarch64-apple-ios-macabi -- -D warnings
