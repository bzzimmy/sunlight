[package]
name = "sunlight"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["Ben Zimmermann"]
publish = false

[dependencies]

[profile.release]
debug = 1

[profile.release-lto]
inherits = "release"
opt-level = 3
debug = "none"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
